# Optional development/test override; use with the canonical Compose file.
services:
  backend-test:
    image: multi-agent-os:test
    build:
      context: ./backend
      target: dev
    environment:
      APP_ENV: testing
      DATABASE_URL: ${DATABASE_URL:?Use an isolated test database}
      MAOS_TEST_DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Generate test configuration}
      REDIS_URL: redis://redis:6379/0
      MAOS_EXTENSION_MODULES: maos_examples.text_review
    command: [pytest]
